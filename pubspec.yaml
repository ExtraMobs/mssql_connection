name: mssql
description: SQL Server client using Dart FFI and bundled FreeTDS. Requires TLS with certificate verification enabled by default. Windows x64; web is not supported.
version: 0.0.1
homepage: https://github.com/ExtraMobs/mssql_connection

environment:
  sdk: ^3.9.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MssqlConnectionPlugin
