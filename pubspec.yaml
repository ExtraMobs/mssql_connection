name: mssql_connection
description: Cross-platform Dart FFI plugin for Microsoft SQL Server databases using FreeTDS. Supports Windows, Android, iOS, macOS, and Linux natively.
version: 3.0.0
homepage: https://github.com/ExtraMobs/mssql_connection

environment:
  sdk: ^3.9.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MssqlConnectionPlugin
      android:
        ffiPlugin: true
