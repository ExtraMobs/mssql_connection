name: mssql_connection
description: A starting point for Dart libraries or applications.
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MssqlConnectionPlugin
      android:
        ffiPlugin: true
